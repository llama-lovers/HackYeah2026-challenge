<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><title>Głosowy agent – ustawienia</title></head>
<body>
  <main>
    <h1>Głosowy agent</h1>
    <p id="output-recovery" role="alert" tabindex="-1" hidden></p>
    <button id="ack-recovery" type="button" hidden>Rozumiem</button>
    <p>Aby wydawać polecenia głosem, wtyczka potrzebuje jednorazowego dostępu do mikrofonu.</p>
    <button type="button" id="grant-mic" autofocus>Włącz mikrofon</button>
    <p id="mic-status" role="status" aria-live="polite"></p>
    <h2>Skrót klawiszowy</h2>
    <p id="shortcut-info" role="status"></p>
    <p id="stop-shortcut-info" role="status"></p>
    <p id="stop-latency"></p>
    <h2>Sposób odczytywania komunikatów</h2>
    <label for="output-mode">Głos agenta</label>
    <select id="output-mode">
      <option value="screen_reader">Czytnik ekranu</option>
      <option value="browser_tts">Polski głos przeglądarki</option>
    </select>
    <p id="output-status" role="status"></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
