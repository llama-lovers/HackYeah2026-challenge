services:
  piper-tts:
    build: .
    env_file:
      - path: config.env
        required: false
    environment:
      TTS_HOST: 0.0.0.0
      TTS_PORT: 7001
      TTS_MODEL_DIR: /app/models
    ports:
      - "${TTS_PORT:-7001}:7001"
    volumes:
      - ./models:/app/models:ro
    init: true
    restart: unless-stopped
