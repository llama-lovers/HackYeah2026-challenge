[project]
name = "live-piper-tts"
version = "0.1.0"
description = "Local streaming Piper TTS with optional OpenRouter backend"
requires-python = ">=3.12,<3.13"
dependencies = ["piper-tts==1.8.0", "fastapi==0.118.0", "uvicorn==0.37.0", "httpx==0.28.1", "num2words==0.5.14"]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
